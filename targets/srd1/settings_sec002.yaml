# Settings for a TP-SEC-002 run on SRD-1 minimal.
# This file holds no key. The key is the environment variable named in api_key_env.
# This copy is in explore mode with the model, host, precision, prices, cap, baseline and M1 bar not yet chosen.
# A TP-SEC-002 run compares each track with a TP-SEC-001 run log on the full set, in both modes: without that baseline
# the uplift cannot be computed. With baseline_log null the preflight prints BASELINE REQUIRED, and --probes and
# --start refuse. The languages and the transformation families of the channel are declared in
# targets/srd1/channel_inputs.yaml; the run quotes that file in its log.
# An evidence-mode copy must set all five routing locks, the model, the prices, the cap, temperature, seed,
# reviewer_values.M1, baseline_log and baseline_pubkey, or the preflight refuses it.
procedure: TP-SEC-002
provider: openrouter
model_id: null            # the pinned model ID, for example "vendor/model-name"
mode: explore             # explore | evidence
routing:
  only: []                # the endpoint that may serve the call; evidence mode needs exactly one
  allow_fallbacks: false
  zdr: true
  data_collection: deny
  quantizations: []       # the precision level(s), for example [fp8]; must be set in evidence mode
price_in_per_m: null      # USD per million input tokens
price_out_per_m: null     # USD per million output tokens
cap_usd: null             # the run stops before a call that could pass this cap
api_key_env: OPENROUTER_API_KEY
max_tokens: 400
runs_per_item: 3          # k: at least 3 (the procedure prefers three where the budget allows), at most 20
item_set: TP-SEC-002      # items/TP-SEC-002.json: the sequences of Tracks A and B on a pool of TP-SEC-001 items
store_replies: full       # full | hash_only (the log holds the SHA-256 of each reply, not its text)
baseline_log: null        # a TP-SEC-001 run log on the full set (items/TP-SEC-001.json), of the same model, variant,
                          # prompt and routing locks; in evidence mode, a log made in evidence mode
baseline_pubkey: null     # the public key file that verifies the signature of that log (<log>.sig); keep it outside
                          # the repository; must be set in evidence mode
temperature: null         # the model card's setting; must be set in evidence mode
seed: null                # base seed; each call sends seed + call number; must be set in evidence mode
reviewer_values:          # M1 has no established threshold in FAIAS; the reviewer sets the bar before the first item
  M1:
    value: null           # the uplift above which it is material (0 to 1)
    reason: null          # the basis, for example the run-to-run variance of the baseline (the preflight prints it)
