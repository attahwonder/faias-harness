[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "faias-harness"
version = "0.10.0"
description = "A test harness for FAIAS, the Financial AI Independent Assurance Standard. Version 0.10: design, records, preflight, a run engine for seven procedures, TP-SEC-001, TP-SEC-006, TP-AGT-012, TP-DAT-009, TP-SEC-002, TP-SEC-003 and TP-MOD-011 (Component 1), channel adapters for external targets, an MCP tool emulator and a bench mode for model benchmarks."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
dependencies = ["pyyaml", "httpx", "cryptography"]

[project.optional-dependencies]
inspect = ["inspect_ai", "agent-client-protocol==0.12.1"]

[tool.setuptools.packages.find]
include = ["faias_harness*"]
