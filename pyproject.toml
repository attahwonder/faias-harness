[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "faias-harness"
version = "0.6.0.dev0"
description = "A test harness for FAIAS, the Financial AI Independent Assurance Standard. Version 0.6 (in development): design, records, preflight, a run engine for one procedure with its full item set, channel adapters for external targets and an MCP tool emulator."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
dependencies = ["pyyaml", "httpx", "cryptography"]

[project.optional-dependencies]
inspect = ["inspect_ai"]

[tool.setuptools.packages.find]
include = ["faias_harness*"]
