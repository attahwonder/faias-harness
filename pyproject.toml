[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "faias-harness"
version = "0.2.0"
description = "A test harness for FAIAS, the Financial AI Independent Assurance Standard (version 0.2: design, records and preflight)."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
dependencies = ["pyyaml"]

[tool.setuptools.packages.find]
include = ["faias_harness*"]
