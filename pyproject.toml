[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "faias-harness"
version = "0.9.3"
description = "A test harness for FAIAS, the Financial AI Independent Assurance Standard. Version 0.9: design, records, preflight, a run engine for seven procedures, TP-SEC-001, TP-SEC-006, TP-AGT-012, TP-DAT-009, TP-SEC-002, TP-SEC-003 and TP-MOD-011 (Component 1), channel adapters for external targets and an MCP tool emulator."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
dependencies = ["pyyaml", "httpx", "cryptography"]

[project.optional-dependencies]
inspect = ["inspect_ai"]

[tool.setuptools.packages.find]
include = ["faias_harness*"]
