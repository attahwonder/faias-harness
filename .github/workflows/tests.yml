# Run every test of the harness on each push and pull request. It runs on Linux and Windows, with Python 3.11 and 3.14.
# One more job runs the tests on Linux with Python 3.14, inspect_ai 0.3.281 and agent-client-protocol 0.12.1. So the
# tests of the Inspect path run too. Each job clones the FAIAS standard at tag v1.3.4 from github.com. It installs
# fixed versions of its packages from PyPI. The other packages that inspect_ai needs are not fixed. So a new version
# of one of them can change the result of that job. The jobs use no secret and no key. The token of each job can read
# the repository only.
name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

# A new run on the same ref stops the older run that is still in progress.
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  run-all:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.11", "3.14"]
        include:
          - python: "3.11"
            packages: pyyaml==6.0.3 httpx==0.28.1 cryptography==46.0.7
          - python: "3.14"
            packages: pyyaml==6.0.3 httpx==0.28.1 cryptography==49.0.0
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6.3.0
        with:
          python-version: ${{ matrix.python }}
      - name: Install the three packages
        run: python -m pip install ${{ matrix.packages }}
      - name: Clone FAIAS v1.3.4
        run: git clone --depth 1 --branch v1.3.4 https://github.com/attahwonder/faias-standard "${{ runner.temp }}/faias"
      - name: Run all tests
        run: python -X utf8 tests/run_all.py --faias "${{ runner.temp }}/faias"

  # The steps of run-all, with inspect_ai installed. Some engine tests then run the engines on Inspect, not on the
  # direct loop. Some tests compare the two engines. Without inspect_ai, they print a note and check nothing.
  # inspect_ai is pinned. So is agent-client-protocol, one of the packages that it needs: its version 1.0.0 has no
  # module acp.helpers, which inspect_ai 0.3.281 imports when it runs an eval. The other packages that it needs are
  # not pinned.
  run-all-inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6.3.0
        with:
          python-version: "3.14"
      - name: Install the three packages, inspect_ai and agent-client-protocol
        run: python -m pip install pyyaml==6.0.3 httpx==0.28.1 cryptography==49.0.0 inspect_ai==0.3.281 agent-client-protocol==0.12.1
      - name: Clone FAIAS v1.3.4
        run: git clone --depth 1 --branch v1.3.4 https://github.com/attahwonder/faias-standard "${{ runner.temp }}/faias"
      - name: Run all tests
        run: python -X utf8 tests/run_all.py --faias "${{ runner.temp }}/faias"
