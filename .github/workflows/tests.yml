# Run every test of the harness on each push and pull request. It runs on Linux and Windows, with Python 3.11 and 3.14.
# The job clones the FAIAS standard at tag v1.3.4 from github.com and installs the three packages from pypi.org.
# It uses no secret and no key. The token of the job can read the repository only.
name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  run-all:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.11", "3.14"]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - name: Install the three packages
        run: python -m pip install pyyaml httpx cryptography
      - name: Clone FAIAS v1.3.4
        run: git clone --depth 1 --branch v1.3.4 https://github.com/attahwonder/faias-standard "${{ runner.temp }}/faias"
      - name: Run all tests
        run: python -X utf8 tests/run_all.py --faias "${{ runner.temp }}/faias"
