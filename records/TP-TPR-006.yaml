interpretation:
- outcome: Pass
  text: Pass — the staging test confirms re-indexing triggers fire correctly on embedding-model version change and no undetected mismatch state is reachable in the tested architecture; retrieval-quality monitoring is in place in production with defined relevance thresholds; full data export from the vector database succeeds via documented vendor mechanisms within a reasonable timeframe; the dependency map is current and reviewed at least annually or on material architecture change.
  src: V3_Testing_Playbook/PLAYBOOK_TPR_006.md:53
- outcome: Fail
  text: Fail — the staging test demonstrates a mismatch state producing degraded but undetected retrieval with no monitoring or alert firing; or no retrieval-quality monitoring exists in production and the only signal of a problem is customer complaint; or data export is not possible via any documented mechanism, or requires vendor professional services with no defined SLA; or no dependency map exists linking embedding model version to index validity.
  src: V3_Testing_Playbook/PLAYBOOK_TPR_006.md:54
- outcome: Partial
  text: Partial — triggers fire correctly and monitoring exists, but export is only partially successful (vectors recoverable, index configuration not), or the dependency map exists but has not been reviewed since a material architecture change. Quantify what is recoverable and what is not.
  src: V3_Testing_Playbook/PLAYBOOK_TPR_006.md:55
