interpretation:
- outcome: Pass
  text: Pass — an evaluation-environment record exists and names the divergences from production; the authorisation record acknowledges them and states what the evidence can and cannot carry; where reasoning traces are retained, the test-awareness indication has been measured on the firm's own traces with the scoring method and judge version pinned, and the consequential metric is reported split by that indication and dispositioned against a documented tolerance, or, where none exists, against a clearly stated judged tolerance with the absence reported as a finding; where no reasoning traces are retained, that limitation is recorded in the authorisation record rather than left unstated, and the finding states what the unavailable split narrows; the provider's published evaluation-awareness statements for the model version in use have been reconciled against the firm's own results, or their absence for that version recorded; paired test-framed and deployment-framed runs have been performed at a pinned configuration with the delta recorded as an upper bound; independent review of the external-validity argument has been performed; and a post-deployment comparison exists with a recorded disposition.
  src: V3_Testing_Playbook/PLAYBOOK_MOD_016.md:65
- outcome: Fail
  text: Fail — the authorisation paper asserts that UAT, internal evaluation or pilot results are representative of deployment with no stated basis and no evaluation-environment record to supply one; or no divergence inventory exists; or traces are retained but have never been scored, or a provider's rate for a different model version is presented as the firm's own measurement; or the consequential metric is a single figure with no stratified split and no statement that the split was impossible and why; or no paired-framing comparison has been performed and the firm's position is that the harness is production-representative because it was built to be; or the authorisation record states no limit, or states a limit the evidence does not support such as divergence having been ruled out; or a post-deployment divergence was attributed to drift, data quality or a model change without the evidence base being reconsidered.
  src: V3_Testing_Playbook/PLAYBOOK_MOD_016.md:66
- outcome: Partial
  text: 'Partial — the canvas''s own shape: an external-validity basis exists for one evaluation use case while the same authorisation also relies on other pilot or vendor evidence with no equivalent basis; the objective is not met for the second pending equivalent treatment. The distinct partial case this procedure must report precisely: where the deployed model retains no reasoning traces and the authorisation record does not record that limitation, limbs 3 and 4 are unavailable on that system and the narrowing goes unstated. The unavailability is a limitation of the evidence available, not a failure of the firm''s control; not recording it, and not saying what it narrows, is the firm''s omission, and that omission is what makes the case Partial. Where the limitation and what it narrows are both recorded, a system retaining no traces is not held Partial on that ground. Report which downstream conclusions rest on which.'
  src: V3_Testing_Playbook/PLAYBOOK_MOD_016.md:67
