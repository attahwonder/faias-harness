interpretation:
- outcome: Pass
  text: Pass — every available deployment pathway for prompt/parameter changes enforces version control with no informal bypass; a fixed regression suite runs automatically on every change with material divergence blocking promotion; change-approval records exist at the same rigour as for code; rollback to a known-good version has been demonstrated within the defined recovery objective.
  src: V3_Testing_Playbook/PLAYBOOK_MOD_013.md:50
- outcome: Fail
  text: Fail — a bypass pathway exists (vendor console, shared prompt-editing document) allowing changes to reach production without version control or regression testing; no fixed regression suite exists and testing is ad hoc and undocumented; historical evidence shows a prompt or parameter change reached production and caused a detectable behavioural shift before being caught, or was never caught and surfaced only via complaint; rollback is not demonstrated or not achievable within a defined time bound.
  src: V3_Testing_Playbook/PLAYBOOK_MOD_013.md:51
- outcome: Partial
  text: Partial — the primary pathway is fully governed while a secondary one is not; or the regression suite runs but has no promotion-blocking criteria, so it informs without controlling. Report per pathway — an average across pathways is meaningless when a single bypass defeats the control.
  src: V3_Testing_Playbook/PLAYBOOK_MOD_013.md:52
