design:
- text: Component 2 — behavioural-divergence measurement. Take a historical prompt change (preferred) or a constructed representative change, and run the firm's fixed regression suite against both versions on a representative task sample. Measure divergence in accuracy, refusal rate, and tone/content shift. The reviewer, having run TP-MOD-001 to 009, is well placed to select a change that is plausible and behaviourally meaningful rather than trivial.
