interpretation:
- outcome: Pass
  text: Pass — production traffic is version-pinned and roll-forward is deliberate and logged; a canary/regression suite runs on every release with documented criteria and retained results; contractual advance-notice rights exist and have been exercised at least once; a capability-delta re-approval gate exists and has been exercised; no undetected material behavioural drift over the last 12 months.
  src: V3_Testing_Playbook/PLAYBOOK_MOD_002.md:52
- outcome: Fail
  text: Fail — production auto-updates to new vendor versions with no pinning, canary testing or notice; no regression suite, or one covering functional correctness only and not behavioural/safety dimensions; contract silent on advance notice; approval treated as a one-time event regardless of subsequent vendor changes; historical evidence of a vendor-side change reaching production and being discovered only via complaint or anomalous output.
  src: V3_Testing_Playbook/PLAYBOOK_MOD_002.md:53
- outcome: Partial
  text: Partial — pinning exists but the regression suite lacks the refusal category, so capability expansion specifically would go undetected; or the gate exists in policy and has never been exercised across several releases (indistinguishable from absence in practice — report as partial with that observation).
  src: V3_Testing_Playbook/PLAYBOOK_MOD_002.md:54
