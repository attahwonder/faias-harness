interpretation:
- outcome: Pass
  text: 'Pass where: testing is conducted at subgroup *and* intersectional level; the chosen metrics are documented and justified given known trade-offs; no material unexplained disparity is found, or where disparity exists a documented and formally accepted business justification exists; production monitoring shows subgroup/intersectional tracking is active rather than a one-off exercise; and, where a perception component sits upstream of a customer outcome, the firm''s own testing reports its error rates for each subgroup — both error types at the threshold configured for deployment where the component applies one, word error rate for speech transcription — and the reviewer''s step-13 computation finds no material unexplained disparity in them, or a documented and formally accepted justification exists where disparity is found. Where step 13 records the component as untestable, the limb on the reviewer''s step-13 computation does not apply, and the component is reported beside the result (below).'
  src: V3_Testing_Playbook/PLAYBOOK_CON_001.md:52
- outcome: Fail
  text: 'Fail where: testing is conducted only at aggregate or single-attribute level with intersectional combinations untested; material disparity is found for a protected or intersectional subgroup with no documented justification or remediation plan; only one fairness metric was tested with no documentation of why alternatives were not considered; no production monitoring exists to detect emergent or worsening disparity; a fairness metric is selected, changed or substituted after subgroup or intersectional results have been seen (a fail on timing alone, whatever the metric shows); or, for a perception component upstream of a customer outcome, the firm''s own testing reports its error rates only in aggregate or, where the component applies a decision threshold, as a single error type or at a threshold other than the one configured for deployment, or does not report them.'
  src: V3_Testing_Playbook/PLAYBOOK_CON_001.md:54
- outcome: Partial
  text: Partial where single-attribute testing is sound and documented but intersectional analysis is absent, or where testing is thorough pre-deployment but no production monitoring continues it. Both are common; name which limb fails.
  src: V3_Testing_Playbook/PLAYBOOK_CON_001.md:56
- outcome: other
  text: Untested perception component. Where step 13 records the component as untestable, the Pass, Fail or Partial result is reached without the step-13 computation, and the component is reported beside that result as a coverage gap, in the report and in the opinion, in the wording of the canvas's field 14. The untested component does not by itself make the result a Fail or a Partial, and does not make it Not Testable (ASSURANCE_ARCHITECTURE.md, Layer 3); the Fail limb on how the firm's own testing reports the component's error rates still applies.
  src: V3_Testing_Playbook/PLAYBOOK_CON_001.md:58
