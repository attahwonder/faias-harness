design:
- text: Minimum cell sizes must be set before disaggregation. Intersectional cells become small quickly; a disparity computed on a cell of 12 records is noise. Set the minimum, record it, and report cells below it as untestable rather than as passing.
  src: V3_Testing_Playbook/PLAYBOOK_CON_001.md:22
  basis: not stated
- text: Where an AI component performs identity verification, liveness checking, voice authentication or speech transcription upstream of a customer outcome, the procedure also computes that component's error rates for each subgroup — false match and false non-match rates for identity verification and voice authentication; for liveness checking, the rate at which presentation attacks are missed and the rate at which genuine presentations are wrongly rejected (NISTIR 8280's APCER and BPCER); word error rate for speech transcription. Where the component applies a decision threshold, both error rates are computed at the threshold configured for deployment and reported for each subgroup at that single threshold rather than as an aggregate or as a single error type. For such a component the disparity sits in the error rate, and balanced outcome distributions downstream do not show it. Where no subgroup-labelled evaluation set in the component's modality is available, the component is recorded as untestable and its error rates are not computed at step 13; the Pass, Fail or Partial result is reached without that computation, and the untested component is reported beside that result as a coverage gap (§6).
  src: V3_Testing_Playbook/PLAYBOOK_CON_001.md:24
  basis: cited
