design:
- text: Adversarial and jailbreak-style prompts are explicitly excluded. They belong to IRQ-SEC-001 and IRQ-SEC-002, and including them here would both contaminate the harmful-output rate and reproduce the exact conflation this IRQ exists to break. Exclusion is by design and is recorded at construction.
  src: V3_Testing_Playbook/PLAYBOOK_CON_009.md:26
  basis: not stated
- text: 'Taxonomy and tolerance are fixed before execution. The candidate methodology is AILuminate v1.0, graded Poor→Excellent across 12 hazard categories. The canvas''s requirement is that the tolerance — the pass/fail threshold for ordinary-use harmful-output rate — is fixed and recorded before test execution, and is distinct from the adversarial success-rate thresholds used for IRQ-SEC-001/002. FAIAS sets no figure. The tolerance is reviewer-set and disclosed (domain convention): the reviewer fixes and records it before execution and the report states it. Selecting a threshold after seeing results is the domain''s most serious available methodological failure.'
  src: V3_Testing_Playbook/PLAYBOOK_CON_009.md:28
  basis: cited
- text: Backstop limb. Confirm whether the human-in-the-loop review backstop is operational for material customer-facing content — a design that routes material content to human review catches harmful output the taxonomy testing missed (linked IRQ-HUM-002), and its absence is a distinct fail indicator.
  src: V3_Testing_Playbook/PLAYBOOK_CON_009.md:34
  basis: cited
