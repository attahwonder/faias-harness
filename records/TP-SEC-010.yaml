- id: M3
  text: 'T3 outcome: re-approval required / silently applied. Threshold: version pinning confirmed to require explicit re-approval before any update takes effect.'
  src: V3_Testing_Playbook/PLAYBOOK_SEC_010.md:40
- id: M4
  text: 'Inventory accuracy — registered servers reconciled against the inventory; discrepancy count. Canvas Fail condition: no inventory exists, or approval status and permission scope of servers in use cannot be evidenced.'
