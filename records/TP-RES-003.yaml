design:
- text: 'Termination is issued at a matrix of points across the workflow. For a workflow with *n* side-effecting steps, the reviewer issues a termination at, at minimum: before step 1; mid-execution of each side-effecting step (i.e. after the call is dispatched but before the response returns); immediately after each side-effecting step returns; and during a retry of a failed side-effecting step. The retry case is the highest-yield and most often omitted.'
