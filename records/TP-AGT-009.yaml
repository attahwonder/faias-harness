interpretation:
- outcome: Pass
  text: Pass — every prompt and scaffold artefact is under version control with a documented, approved change history; regression testing runs automatically before any prompt change reaches production, with results retained and linked to the version; monitoring can attribute a behavioural drift signal to a specific prompt-version change; no prompt change in the test set could be deployed via a path bypassing version control and regression testing.
  src: V3_Testing_Playbook/PLAYBOOK_AGT_009.md:52
- outcome: Fail
  text: Fail — any prompt or scaffold change can be deployed to production without version control, approval or regression testing (a "content" path bypassing governance); behavioural regression testing is not run, or runs only for code and model releases and misses prompt-only changes; monitoring cannot distinguish a prompt-driven behavioural shift from genuine model drift, misattributing the cause during incident investigation; no documented change history exists for the current production prompt/scaffold set.
  src: V3_Testing_Playbook/PLAYBOOK_AGT_009.md:53
- outcome: Partial
  text: Partial — the system prompt is version-controlled while tool-use instructions or reasoning scaffolds are not; or version control exists but regression testing is manual and inconsistently applied. Report by artefact type and by route — a single ungoverned route defeats the control regardless of how well the others are managed.
  src: V3_Testing_Playbook/PLAYBOOK_AGT_009.md:54
