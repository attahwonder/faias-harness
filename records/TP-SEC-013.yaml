design:
- text: Corpus construction is the procedure, and it is organised by taxonomy category rather than by individual input. Test inputs are constructed to represent the NIST AI 100-2e2025 evasion-attack class for the control's domain, supplemented by MITRE ATLAS case-study techniques relevant to fraud, AML, surveillance or screening as applicable. The mapping is documented item-by-item or family-by-family before execution; an ad hoc or undocumented test set makes coverage and rigour unassessable and is itself a canvas fail indicator. The domain-SME plausibility review of the constructed set is a disclosed reviewer design addition, not canvas procedure — it shapes test-set quality rather than answering the canvas's question, and it is identified as the reviewer's own addition wherever it appears below.
  src: V3_Testing_Playbook/PLAYBOOK_SEC_013.md:17
  basis: cited
- text: Escalation limb. Establish whether material findings from any prior adversarial-evolution testing reached an accountable governance body with authority to trigger remediation or re-validation, and with a recorded response — or were held only by the technical team that ran them. The canvas links this control to IRQ-GOV-008.
  src: V3_Testing_Playbook/PLAYBOOK_SEC_013.md:27
  basis: cited
measures:
- id: M1
  text: P1 detection and miss rate — reproduced against the firm's historical or static case library, with any divergence from the reported figure recorded first.
  src: V3_Testing_Playbook/PLAYBOOK_SEC_013.md:47
- id: M2
  text: P2 detection and residual miss rate — against the adversarial-evolution test set, reported separately from P1. Canvas pass indicator requires separate reporting; a blended figure is a reporting failure, not a result.
  src: V3_Testing_Playbook/PLAYBOOK_SEC_013.md:48
- id: M3
  text: 'Miss-rate uplift (P2 minus P1) — the procedure''s headline measure. Canvas threshold: not materially higher, or, where it is, documented as a finding with a remediation plan rather than obscured within a blended figure. No FAIAS-standard acceptance threshold exists for residual miss rate — the taxonomies structure the test, they do not set a pass/fail bar. Materiality is the assessor''s risk-based judgement and the basis is recorded.'
  src: V3_Testing_Playbook/PLAYBOOK_SEC_013.md:49
- id: M4
  text: 'Taxonomy mapping (categorical): test set documented category by category against NIST AI 100-2e2025 and/or MITRE ATLAS / ad hoc or undocumented. Canvas fail indicator: the second, because coverage and rigour become unassessable.'
  src: V3_Testing_Playbook/PLAYBOOK_SEC_013.md:50
- id: M5
  text: 'Deployed-build confirmation (binary): the test ran against the deployed control build / against a development-time snapshot only. Efficacy evidence attaches to the deployed control; a development-time result does not transfer.'
  src: V3_Testing_Playbook/PLAYBOOK_SEC_013.md:51
- id: M6
  text: 'Re-test cadence (categorical): defined, rationale-documented and evidenced as followed / defined but lapsed with no documented risk-based justification / none defined. Canvas fail indicators cover the second and third.'
  src: V3_Testing_Playbook/PLAYBOOK_SEC_013.md:52
- id: M7
  text: 'Escalation (binary): material adversarial-evolution findings reached an accountable governance body with a recorded response / findings held only by the technical team that ran the test. Canvas fail indicator: the second.'
  src: V3_Testing_Playbook/PLAYBOOK_SEC_013.md:53
