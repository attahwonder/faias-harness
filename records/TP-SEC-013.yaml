interpretation:
- outcome: Pass
  text: Pass — the adversarial-evolution test set is constructed with documented mapping to NIST AI 100-2e2025 and/or MITRE ATLAS rather than assembled ad hoc; the miss rate against it is reported separately from the historical-case detection rate and is not materially higher — or, where it is, that gap is documented as a finding with a remediation plan rather than obscured within a blended figure; a defined re-test cadence exists, tied to a documented risk-based rationale rather than a bare calendar default, and is evidenced as followed; and material findings are shown to have reached an accountable governance body with a recorded response.
  src: V3_Testing_Playbook/PLAYBOOK_SEC_013.md:56
- outcome: Fail
  text: Fail — no adversarial-evolution testing exists and control efficacy is evidenced solely by detection rate against a historical or static case library; or a test set exists but is undocumented against any recognised taxonomy, making its coverage and rigour unassessable; or the miss rate against adversarial-evolution testing is materially higher than the historical detection rate and this gap is not disclosed, escalated or actioned; or no defined re-test cadence exists, or the evidenced cadence has lapsed with no documented risk-based justification; or testing exists but its findings are held only by the technical team that ran it, with no evidence they reached governance.
  src: V3_Testing_Playbook/PLAYBOOK_SEC_013.md:57
- outcome: Partial
  text: 'Partial — the canvas''s own shape: adversarial-evolution testing has been performed and mapped to NIST AI 100-2e2025, but the resulting miss-rate uplift versus the historical case library has not been escalated to a governance body, and no re-test cadence has been defined. The assurance objective is not met until both gaps close. Report the uplift figure regardless, since it is the substantive result.'
  src: V3_Testing_Playbook/PLAYBOOK_SEC_013.md:58
