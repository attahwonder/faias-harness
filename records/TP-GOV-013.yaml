design:
- text: 'The distinction the whole procedure turns on: retrieval of one named record is not cohort enumeration. The firm may be able to reconstruct any decision on request — that is TP-GOV-010''s capability, and it is a necessary precondition here — and still have no way to work backwards from a failure signature to a population. The two sound adjacent and require entirely different query architecture: per-decision key lookup against signature-based cohort enumeration.'
