interpretation:
- outcome: Pass
  text: Pass where the firm enumerates the full synthetic cohort from the supplied failure signature within a reasonable, stated timeframe and without manual case-by-case investigation; query capability spans model/configuration/prompt version, logic defect and date range rather than a subset; a proactive remediation trigger exists and is evidenced to have activated at least once historically without waiting for a complaint; named ownership of cohort-level remediation is distinct from, and does not default to, individual complaint-handling ownership; and the exercise log shows the capability has been rehearsed, not only designed.
  src: V3_Testing_Playbook/PLAYBOOK_GOV_013.md:61
- outcome: Fail
  text: 'Fail where: the firm can reconstruct only the individual decision supplied and has no mechanism to enumerate other decisions sharing the same signature; or cohort identification, where possible at all, requires extensive manual investigation with no defined query capability or measurable timeframe; or no proactive remediation trigger exists and remediation is confirmed to occur only in response to an inbound complaint; or the decision store cannot be queried by model/configuration/prompt version or defect signature, only by customer or decision identifier; or no rehearsal or historical exercise evidence exists and the capability, if claimed, has never actually been tested.'
  src: V3_Testing_Playbook/PLAYBOOK_GOV_013.md:63
- outcome: Partial
  text: Partial where — the canvas's own shape — the firm can enumerate a cohort by model or configuration version but not by prompt or logic-defect signature specifically, and the proactive trigger has been designed but never exercised. The assurance objective is not yet met; remediation should extend query capability to all signature fields and rehearse the proactive trigger. Report the field-by-field result from step 5, which is what makes this finding actionable rather than directional.
  src: V3_Testing_Playbook/PLAYBOOK_GOV_013.md:65
