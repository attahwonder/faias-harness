design:
- text: Sampling. Every path in the firm's data-flow map plus every path the reviewer independently identifies, each exercised with at least 3 distinct markers across at least 3 usage patterns (simple chat, retrieval-grounded query, agentic/tool-chained task where applicable) — a reviewer-set design minimum, disclosed at scoping.
  src: V3_Testing_Playbook/PLAYBOOK_SEC_008.md:24
  basis: reviewer-set design minimum
measures:
