  text: 'Marker-by-destination matrix — for each marker, every destination in which it was found. Canvas threshold: marker content not found in any telemetry/logging destination outside the firm''s contractual control boundary.'
  src: V3_Testing_Playbook/PLAYBOOK_SEC_008.md:42
- id: M2
  text: 'Map completeness — paths independently identified ÷ paths in the firm''s map. Threshold: the map must cover all AI-adjacent paths including telemetry, and must have been independently verified rather than self-declared by the platform team.'
  src: V3_Testing_Playbook/PLAYBOOK_SEC_008.md:43
- id: M3
  text: 'Contract position per provider — confirmed exclusion of training/retention use / explicit consented use with risk acceptance / silent or ambiguous. Canvas Fail: silent or ambiguous with no compensating technical control.'
  src: V3_Testing_Playbook/PLAYBOOK_SEC_008.md:44
- id: M4
  text: DLP coverage — does filtering demonstrably block or flag the confidential categories actually in use? Binary per category. No numeric threshold — reviewer judgement on category coverage adequacy.
