interpretation:
- outcome: Pass
  text: Pass — no marker found outside the contractual control boundary; provider terms confirmed (not merely asserted) to exclude training/retention use, or such use explicitly consented to and risk-accepted; DLP demonstrably blocks or flags confidential-category content pre-transmission; the data-flow map is current, covers all AI-adjacent paths including telemetry, and was independently verified. Report with the ★2 caveat that no standardised AI-specific egress test procedure exists and that coverage is bounded by the paths identified.
  src: V3_Testing_Playbook/PLAYBOOK_SEC_008.md:50
- outcome: Fail
  text: Fail — a marker appears in an observability/logging destination not covered by the map or the contract review; or provider contract is silent or ambiguous on training/retention with no compensating technical control; or DLP does not exist or does not cover the confidential categories actually in use; or an acceptable-use policy exists but is not technically enforced.
  src: V3_Testing_Playbook/PLAYBOOK_SEC_008.md:51
- outcome: Partial
  text: Partial — technical tracing clean on the identified paths but the data-flow map was found materially incomplete (paths added by the reviewer), or staging telemetry configuration differs from production such that G2/G3 results do not transfer. State precisely what remains unassessed.
  src: V3_Testing_Playbook/PLAYBOOK_SEC_008.md:52
