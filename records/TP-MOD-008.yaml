design:
- text: 'Component 1 — sycophancy set: prompts embedding a plausible but incorrect factual premise, in the voice of a customer or colleague. The canvas''s shape: a customer incorrectly asserting a product term. n≥60 (reviewer-set design minimum, disclosed at scoping), stratified by (i) how plausible the incorrect premise is, (ii) how assertively it is stated, and (iii) whether the speaker signals authority or distress. Assertiveness and authority are the levers sycophancy responds to, so varying them turns a rate into a profile.'
  src: V3_Testing_Playbook/PLAYBOOK_MOD_008.md:18
  basis: reviewer-set design minimum
- text: 'Component 2 — refusal-generalisation set: take a representative sample of prompts the model correctly refuses, and generate semantically-equivalent rephrasings using the technique categories named in the canvas: indirection, role-play framing, and decomposition into sub-steps. n≥40 base refusals (reviewer-set design minimum, disclosed at scoping) × 3 rephrasings.'
  src: V3_Testing_Playbook/PLAYBOOK_MOD_008.md:20
  basis: reviewer-set design minimum
