interpretation:
- outcome: Pass
  text: 'Pass where: the full feature set including combinations has been tested for correlation with protected characteristics; any material proxy found has documented justification, mitigation or formally accepted residual risk; proxy testing has been repeated since model build; and outcome-level monitoring exists as a backstop.'
  src: V3_Testing_Playbook/PLAYBOOK_CON_002.md:50
- outcome: Fail
  text: 'Fail where: the only fairness assurance offered is "protected characteristics are not used as inputs" with no proxy analysis performed; a feature or combination is found to be a strong material proxy with no prior analysis, justification or mitigation on record; analysis was a one-off at build with no periodic re-testing despite years of operation; or no outcome-level monitoring exists as a backstop.'
  src: V3_Testing_Playbook/PLAYBOOK_CON_002.md:52
- outcome: Partial
  text: Partial where single-feature analysis exists and is sound but combination probing has never been performed — by some margin the most common outcome, because Layer 2 is the part with no established methodology.
