interpretation:
- outcome: Pass
  text: Pass — contamination probes on cited benchmarks show no material evidence of memorisation, with reproduction at or near chance for held-out comparators; approval evidence includes at least one independent, firm-relevant held-out evaluation corroborating the cited benchmark's implied capability level; documentation records the contamination check and its result rather than citing the raw score alone; where a contamination risk was identified, the approval decision was revisited and re-tested.
  src: V3_Testing_Playbook/PLAYBOOK_MOD_011.md:50
- outcome: Fail
  text: Fail — approval papers cite a vendor or public benchmark score with no contamination check of any kind; guided-prompting probes show material memorisation on the cited benchmark; independent firm-relevant held-out testing shows materially lower performance than the cited score with no reconciliation or re-approval; model-selection decisions rest on public leaderboard position alone.
  src: V3_Testing_Playbook/PLAYBOOK_MOD_011.md:51
- outcome: Partial
  text: Partial — no memorisation is detected but no firm-relevant held-out corroboration exists either, so the approval still rests on an uncorroborated external score; or corroboration exists for one claimed capability and not others. Report which capability claims are corroborated and which are not.
  src: V3_Testing_Playbook/PLAYBOOK_MOD_011.md:52
