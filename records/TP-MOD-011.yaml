design:
- text: 'Component 1 — guided-prompting contamination probe: for each benchmark cited in the approval papers, present the model with a partial excerpt of a benchmark item and measure whether it reproduces the exact remainder at a rate exceeding chance. Compare against a comparably-structured but demonstrably novel item — the novel comparator is what converts a raw reproduction rate into evidence of memorisation rather than of general competence. n≥50 benchmark items and n≥50 matched novel comparators per benchmark (reviewer-set design minimum, disclosed at scoping).'
  src: V3_Testing_Playbook/PLAYBOOK_MOD_011.md:18
  basis: reviewer-set design minimum
- text: 'Component 2 — held-out firm-relevant corroboration: construct or source a small evaluation set from internal historical case files covering the same claimed capability as the cited benchmark, verified not to be publicly scraped. n≥50 (reviewer-set design minimum, disclosed at scoping). Compare performance against the cited benchmark score.'
  src: V3_Testing_Playbook/PLAYBOOK_MOD_011.md:19
  basis: reviewer-set design minimum
