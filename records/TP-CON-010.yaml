interpretation:
- outcome: Pass
  text: Pass where the exit-versus-acquisition comparison has been performed for every PRIN 2A.6.2R(4) action the deployment supports, with repeat runs rather than a single walk-through; no material asymmetry is found, or each is classified, documented and either accepted with a stated basis or remediated; paired probes show no unexplained divergence between matched profiles; the FG22/5 ¶9.27 retention bound is operative in configuration; and any per-customer personalisation of friction is inventoried and justified.
  src: V3_Testing_Playbook/PLAYBOOK_CON_010.md:59
- outcome: Fail
  text: 'Fail where: no exit-versus-acquisition comparison exists and the journey''s conduct evidence is a sludge audit of the journey as designed; or a material asymmetry is found and is unclassified, undocumented and unaccepted; or paired probes show friction varying with a customer attribute with no recorded justification, or the firm cannot say whether its journey varies friction per customer; or the layer carries a retention, save or containment objective with no bound on it in configuration; or production data shows exit-path abandonment materially above the acquisition baseline, or complaint themes on difficulty of exit, with no corresponding finding in prior testing.'
  src: V3_Testing_Playbook/PLAYBOOK_CON_010.md:61
- outcome: Partial
  text: 'Partial where — the canvas''s own shape — the comparison was performed for the cancellation path and found no material asymmetry, but the claim and complaint paths, both named in PRIN 2A.6.2R(4), were not measured and no paired probe was run. Also partial where an irreversible downstream action prevented completion of a path in staging and the remaining steps were assessed on artefacts: say which paths were walked and which were read.'
  src: V3_Testing_Playbook/PLAYBOOK_CON_010.md:63
