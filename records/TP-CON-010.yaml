design:
- text: 'Limb (a) — exit-versus-acquisition effort comparison. For each PRIN 2A.6.2R(4) lifecycle action the deployment supports, walk the path end to end and record steps, screens, dialogue turns, mandatory fields, which option is pre-selected at each branch, and elapsed time to completion; then walk the matched acquisition or upgrade path for the same product and record the same measures. The comparison standard is the regulator''s own: FG22/5 ¶9.26 — switching out, leaving, or making a change should be at least as easy as buying in the first place. PRIN 2A.6.4G(2)''s head is channel-agnostic — "unreasonable delays when retail customers attempt to engage with the firm", of which disproportionately longer call waiting times to cancel than to purchase are the Handbook''s stated example — so an AI-mediated channel is within the indicator directly and no telephone-channel analogy is needed; turn count and step count are how the delay presents there. Where the path is a claim or a complaint, 2A.6.4G(3) reaches the evidence limbs as well — unreasonable delays to "the firm requesting necessary information or evidence from retail customers" or "the firm processing information or evidence received from retail customers" — so evidence requests and re-statement loops are measured as part of the path rather than treated as outside it.'
  src: V3_Testing_Playbook/PLAYBOOK_CON_010.md:20
  basis: not stated
- text: 'Because the path is generated, one walk-through is a sample. Each walk-through is repeated at a pinned configuration — model version, prompt build, guardrail and journey configuration all fixed — and the reported figure is the distribution across runs, not a single observation. This applies the repeat-run discipline IRQ-MOD-014 establishes for output stability, for the same reason: a system that produces a short exit path on one run and a long one on the next has not passed, and a single run cannot tell the difference.'
  src: V3_Testing_Playbook/PLAYBOOK_CON_010.md:22
  basis: not stated
- text: 'Limb (c) — retention-dialogue and personalisation configuration review. Read the layer''s system prompt, policy and guardrail configuration, its objective or reward signal, any retention or save instruction, and any variant-selection, propensity-routing or experiment configuration. Assess each against FG22/5 ¶9.27: retention prompts and incentives are acceptable, and the bound is that they should not unreasonably impact the ease of switching or exiting. The question is whether that bound exists anywhere the system can act on it, or only in a policy the layer never reads.'
  src: V3_Testing_Playbook/PLAYBOOK_CON_010.md:26
  basis: not stated
- text: Classification is the judgement and it is recorded as one. Every friction point found in any limb is classified against PRIN 2A.6.3G as appropriate friction — included to mitigate harm and give the customer opportunity to understand and assess their options, which 2A.6.3G(2) provides does not amount to an unreasonable barrier — or as an unreasonable barrier, against 2A.6.3G(1)'s gloss. No threshold is fixed by FAIAS and none exists in the field. The reviewer records the classification basis for each point before the aggregate conclusion is drawn, and the report states that the materiality judgement was the reviewer's.
  src: V3_Testing_Playbook/PLAYBOOK_CON_010.md:28
  basis: not stated
