interpretation:
- outcome: Pass
  text: Pass — repeated and rephrased queries against known conflicting pairs return consistent, precedence-compliant answers; precedence metadata is demonstrably consulted by the pipeline, not merely documented; retrieval-state logs allow full reconstruction of which version informed a sampled set of interactions; no unresolved conflicting pairs exist in the live index.
  src: V3_Testing_Playbook/PLAYBOOK_DAT_008.md:48
- outcome: Fail
  text: Fail — the same or rephrased query returns different, conflicting answers across runs; no precedence metadata or conflict-resolution logic exists and retrieval relies solely on similarity score; logs do not capture which document version was used, preventing reconstruction; known draft/final or superseded/current documents coexist in the live index with no resolution mechanism.
  src: V3_Testing_Playbook/PLAYBOOK_DAT_008.md:49
- outcome: Partial
  text: Partial — determinism holds for identical queries but breaks under rephrasing or across sessions; or precedence is applied for one conflict family (superseded/current) but not others (regional variants). Report by family and condition — an aggregate consistency figure hides the failure shape.
  src: V3_Testing_Playbook/PLAYBOOK_DAT_008.md:50
