interpretation:
- outcome: Pass
  text: Pass — zero cross-user/cross-tenant retrieval in adversarial testing; simulated DSAR erasure traced and confirmed complete across the primary store and all derived indices, embeddings and caches within the target SLA; a documented retention schedule exists and obsolescence review has demonstrably removed stale records absent a request; memory stores appear in the data inventory with named ownership.
  src: V3_Testing_Playbook/PLAYBOOK_DAT_010.md:50
- outcome: Fail
  text: Fail — adversarial testing retrieves another user's or tenant's memory content; erasure removes the primary record but leaves the subject recoverable from a derived embedding, cache or backup; no retention schedule and memory persists indefinitely by default; memory stores absent from the data inventory and DSAR scope.
  src: V3_Testing_Playbook/PLAYBOOK_DAT_010.md:51
- outcome: Partial
  text: 'Partial — the most common shape: scoping holds, primary-store erasure works, but a derived artefact (typically the vector index or a backup) retains the subject. Report which artefact and the recoverability of the residual content. Also partial where the retention schedule exists but has never executed.'
  src: V3_Testing_Playbook/PLAYBOOK_DAT_010.md:52
