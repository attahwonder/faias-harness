interpretation:
- outcome: Pass
  text: Pass — credential confirmed distinct from any human identity and from other agents; 100% of out-of-scope attempts rejected at the credential/permission layer; revocation effective within the firm's defined target, tested end-to-end; credential lifetime matches documented policy.
  src: V3_Testing_Playbook/PLAYBOOK_SEC_011.md:48
- outcome: Fail
  text: Fail — the agent operates under a shared service account or a reused human credential; or out-of-scope actions succeed; or revocation takes materially longer than the defined target, or requires disabling a shared account affecting other legitimate users/processes; or the credential has no defined lifetime (static, indefinite) with no compensating short-lived-issuance design.
  src: V3_Testing_Playbook/PLAYBOOK_SEC_011.md:49
- outcome: Partial
