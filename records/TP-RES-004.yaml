interpretation:
- outcome: Pass
  text: 'Pass where: restoration testing for model version, prompt and index meets the defined RTO in all tested cases; the restored state passes behavioural regression testing; the agent memory rollback approach (where persistent memory is used) is documented and tested with a defined accepted approach to legitimate-state preservation or an explicit risk-accepted limitation; and restoration has been rehearsed within the last review cycle.'
  src: V3_Testing_Playbook/PLAYBOOK_RES_004.md:49
- outcome: Fail
